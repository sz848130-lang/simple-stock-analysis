# 每日股票分析自动运行配置
name: 每日股票自动分析

on:
  # 每天9:30（北京时间）自动运行
  schedule:
    - cron: '30 1 * * *'  # UTC时间1:30 = 北京时间9:30
  # 手动触发（方便测试）
  workflow_dispatch:

jobs:
  run-stock-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 稳定版本
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install easyquotation smtplib2
      
      - name: 运行股票分析脚本
        env:
          # 读取GitHub Secrets里的环境变量
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PWD: ${{ secrets.EMAIL_PWD }}
        run: python main.py
